<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title></title>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:700|Source+Sans+Pro:300" />
	<link rel="stylesheet" href="assets/css/fontawesome-all.min.css" />
	<link rel="stylesheet" href="assets/css/game.css" />
	<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
</head>
<body>
	<main>
		<div class="board">
			<div class="boxes" id="boxes"></div>
			<div class="click-blocker" aria-hidden="true"></div>
			<div id="out-of-moves-backdrop" class="out-of-moves-backdrop" aria-hidden="true"></div>
			<div id="out-of-moves-popup" class="out-of-moves-popup" role="dialog" aria-label="Out of moves" aria-modal="true" aria-hidden="true">
				<div class="out-of-moves-content">
					<p class="out-of-moves-title">Out of moves.</p>
					<p class="out-of-moves-quip" id="out-of-moves-quip"></p>
				</div>
			</div>
		</div>
		<div class="game-actions">
			<button class="new-game" type="button">New Game</button>
			<button class="how-to-play-button" type="button" aria-label="How to Play"><i class="fas fa-question"></i></button>
			<button class="settings-button" type="button" aria-label="Settings"><i class="fas fa-cog" aria-hidden="true"></i></button>
		</div>
	</main>
	<div id="how-to-play-backdrop" class="how-to-play-backdrop" aria-hidden="true"></div>
	<div id="how-to-play-popup" class="how-to-play-popup" role="dialog" aria-label="How to Play" aria-hidden="true">
		<button class="how-to-play-close" type="button" aria-label="Close"><i class="fas fa-times" aria-hidden="true"></i></button>
		<div class="how-to-play-content">
			<ol>
				<li>Sort all cubes by color.</li>
				<li>Move same-colored cubes together.</li>
				<li>Cubes may only go in an empty tube, or on cube(s) of the same color.</li>
			</ol>
		</div>
	</div>
	<div id="settings-backdrop" class="settings-backdrop" aria-hidden="true"></div>
	<div id="settings-popup" class="settings-popup" role="dialog" aria-label="Settings" aria-hidden="true">
		<button class="settings-close" type="button" aria-label="Close"><i class="fas fa-times" aria-hidden="true"></i></button>
		<div class="settings-content"></div>
	</div>
	<script>
		const PALETTE = [
			"#E6194B", // Crimson
			"#3CB44B", // Green
			"#FFE119", // Yellow
			"#4363D8", // Blue
			"#F58231", // Orange
			"#911EB4", // Purple
			"#42D4F4", // Cyan
			"#000000", // Black
			"#F032E6", // Magenta
			"#469990", // Teal
			"#9A6324", // Brown
			"#FABEBE", // Pink
			"#A9A9A9"  // Gray
		];
		const SET_SIZE = 4;
		const LEVELS = {
			1: { tubes: 8, filled: 6, rows: [4, 4] },
			2: { tubes: 9, filled: 7, rows: [4, 5] },
			3: { tubes: 10, filled: 8, rows: [5, 5] },
			4: { tubes: 11, filled: 9, rows: [5, 6] },
			5: { tubes: 12, filled: 10, rows: [4, 4, 4] },
			6: { tubes: 13, filled: 11, rows: [4, 5, 4] },
			7: { tubes: 14, filled: 12, rows: [4, 5, 5] },
			8: { tubes: 15, filled: 13, rows: [5, 5, 5] }
		};
		const CURRENT_LEVEL = 1;
		const OUT_OF_MOVES_QUIPS = [
			"What a statistically insignificant performance.",
			"Observed unfavorable development on all fronts.",
			"Total loss - no salvage value remaining.",
			"What a catastrophe.",
			"Bad luck, or just terrible inputs?",
			"Actual result emerged as expected.",
		];
		const boxesContainer = document.getElementById("boxes");
		let level = LEVELS[CURRENT_LEVEL];

		function getBoxes() {
			return boxesContainer.querySelectorAll(".box");
		}

		function levelColors(lvl) {
			return PALETTE.slice(0, lvl.filled);
		}

		function applyLevelVisual(lvl) {
			const maxCols = Math.max(...lvl.rows);
			document.body.style.setProperty("--board-cols", String(maxCols));
			document.body.style.setProperty("--board-rows", String(lvl.rows.length));
			document.body.style.setProperty("--set-size", String(SET_SIZE));
		}

		function buildTubes(lvl) {
			boxesContainer.replaceChildren();
			let tubeNumber = 0;
			for (const rowLength of lvl.rows) {
				const row = document.createElement("div");
				row.className = "boxes-row";
				for (let i = 0; i < rowLength; i++) {
					tubeNumber += 1;
					const box = document.createElement("button");
					box.className = "box";
					box.type = "button";
					box.setAttribute("aria-label", `Tube ${tubeNumber}`);
					const stack = document.createElement("span");
					stack.className = "stack";
					box.appendChild(stack);
					row.appendChild(box);
				}
				boxesContainer.appendChild(row);
			}
		}

		function createSolvableGame() {
			const colors = levelColors(level);
			const tubeCount = level.tubes;
			const emptyCount = tubeCount - level.filled;
			const mainCount = level.filled;
			const shufflePasses = tubeCount * tubeCount;

			const tubes = colors.map((color) => Array(SET_SIZE).fill(color));
			while (tubes.length < tubeCount) tubes.push([]);

			for (let master = 0; master < shufflePasses; master++) {
				// Shuffle tubes
				for (let tubeIndex = 0; tubeIndex < tubes.length; tubeIndex++) {
					const cubeCount = tubes[tubeIndex].length;

					// Shuffle cubes within each tube top to bottom
					for (let cubeFromTop = 0; cubeFromTop < cubeCount; cubeFromTop++) {
						if (!tubes[tubeIndex].length) break;

						const destinations = [];
						for (let d = 0; d < tubes.length; d++) {
							if (d !== tubeIndex && tubes[d].length < SET_SIZE)
								destinations.push(d);
						}
						if (!destinations.length) continue;

						const dest = destinations[Math.floor(Math.random() * destinations.length)];
						tubes[dest].unshift(tubes[tubeIndex].shift());
					}
				}

				// Shuffle tubes order before next run
				for (let i = tubes.length - 1; i > 0; i--) {
					const j = Math.floor(Math.random() * (i + 1));
					const swap = tubes[i];
					tubes[i] = tubes[j];
					tubes[j] = swap;
				}
			}

			// Sort tubes by length descending
			tubes.sort((a, b) => b.length - a.length);

			// Empty last empty tubes
			for (let s = tubes.length - 1; s >= tubes.length - emptyCount; s--) {
				while (tubes[s].length) {
					const open = [];
					for (let d = 0; d < mainCount; d++) {
						if (tubes[d].length < SET_SIZE) open.push(d);
					}
					if (!open.length) break;
					tubes[open[Math.floor(Math.random() * open.length)]].unshift(tubes[s].shift());
				}
			}

			// Shuffle filled tubes order one last time
			for (let i = mainCount - 1; i > 0; i--) {
				const j = Math.floor(Math.random() * (i + 1));
				const swap = tubes[i];
				tubes[i] = tubes[j];
				tubes[j] = swap;
			}

			return tubes;
		}

		function renderTube(tube, colors) {
			const stack = tube.querySelector(".stack");
			stack.replaceChildren();
			colors.forEach((color, index) => {
				const cube = document.createElement("span");
				cube.className = "cube";
				cube.dataset.color = color;
				cube.style.setProperty("--cube-color", color);
				cube.style.gridRow = String(SET_SIZE - colors.length + 1 + index);
				stack.appendChild(cube);
			});
		}

		function clearSelection() {
			document.querySelectorAll(".cube.is-selected").forEach((cube) => {
				cube.classList.remove("is-selected");
			});
		}

		function tubeColors(tube) {
			return [...tube.querySelectorAll(".cube")].map((cube) => cube.dataset.color);
		}

		function selectedTube() {
			const cube = document.querySelector(".cube.is-selected");
			return cube ? cube.closest(".box") : null;
		}

		function canMove(moving, destinationColors) {
			if (!moving.length || moving.length + destinationColors.length > SET_SIZE) return false;
			if (!destinationColors.length) return true;
			return destinationColors[0] === moving[0];
		}

		function topRunColors(colors) {
			if (!colors.length) return [];
			const moving = [];
			while (moving.length < colors.length && colors[moving.length] === colors[0]) {
				moving.push(colors[0]);
			}
			return moving;
		}

		function outOfMoves() {
			const tubeList = [...getBoxes()];
			for (const source of tubeList) {
				const moving = topRunColors(tubeColors(source));
				if (!moving.length) continue;

				for (const destination of tubeList) {
					if (destination === source) continue;
					if (canMove(moving, tubeColors(destination))) return false;
				}
			}
			return true;
		}

		function moveCubes(source, destination) {
			const sourceColors = tubeColors(source);
			const moving = topRunColors(sourceColors);
			const destinationColors = tubeColors(destination);
			if (!canMove(moving, destinationColors)) {
				clearSelection();
				return;
			}
			renderTube(destination, moving.concat(destinationColors));
			renderTube(source, sourceColors.slice(moving.length));
			clearSelection();
			if (gameend()) endGame();
			else if (outOfMoves()) showOutOfMovesPopup();
			else resetConfetti();
		}

		function gameend() {
			return [...getBoxes()].every((tube) => {
				const colors = tubeColors(tube);
				return colors.length === 0 || (colors.length === SET_SIZE && colors.every((color) => color === colors[0]));
			});
		}

		function selectTopRun(tube) {
			const cubes = [...tube.querySelectorAll(".cube")];
			const alreadySelected = cubes.some((cube) => cube.classList.contains("is-selected"));
			clearSelection();
			if (alreadySelected || !cubes.length) return;
			const color = cubes[0].dataset.color;
			for (const cube of cubes) {
				if (cube.dataset.color !== color) break;
				cube.classList.add("is-selected");
			}
		}

		function newGame() {
			const tubes = createSolvableGame();
			getBoxes().forEach((tube, index) => {
				renderTube(tube, tubes[index]);
			});
			resetConfetti();
			closeOutOfMovesPopup();
			document.querySelector("main").classList.remove("game-ended");
		}

		function resetConfetti() {
			if (typeof confetti !== "undefined") confetti.reset();
		}

		function endGame() {
			closeOutOfMovesPopup();
			document.querySelector("main").classList.add("game-ended");
			realisticConfetti();
		}

		function showOutOfMovesPopup() {
			clearSelection();
			openOutOfMovesPopup();
		}

		document.querySelector(".new-game").addEventListener("click", newGame);
		const howToPlayPopup = document.getElementById("how-to-play-popup");
		const howToPlayBackdrop = document.getElementById("how-to-play-backdrop");
		const settingsPopup = document.getElementById("settings-popup");
		const settingsBackdrop = document.getElementById("settings-backdrop");
		const outOfMovesPopup = document.getElementById("out-of-moves-popup");
		const outOfMovesBackdrop = document.getElementById("out-of-moves-backdrop");
		const outOfMovesQuip = document.getElementById("out-of-moves-quip");

		function notifyParentHowToPlayOpen(isOpen) {
			try {
				if (window.parent && window.parent !== window) {
					window.parent.postMessage(
						{ source: "kennethhsu-game", type: "how-to-play", open: isOpen },
						window.location.origin
					);
				}
			} catch (err) { /* ignore */ }
		}

		function openHowToPlay() {
			if (outOfMovesPopup.classList.contains("is-visible")) return;
			howToPlayBackdrop.classList.add("is-visible");
			howToPlayBackdrop.setAttribute("aria-hidden", "false");
			howToPlayPopup.classList.add("is-visible");
			howToPlayPopup.setAttribute("aria-hidden", "false");
			notifyParentHowToPlayOpen(true);
		}

		function closeHowToPlay() {
			if (!howToPlayPopup.classList.contains("is-visible"))
				return;
			howToPlayBackdrop.classList.remove("is-visible");
			howToPlayBackdrop.setAttribute("aria-hidden", "true");
			howToPlayPopup.classList.remove("is-visible");
			howToPlayPopup.setAttribute("aria-hidden", "true");
			syncParentOverlayState();
		}

		function openOutOfMovesPopup() {
			const quip = OUT_OF_MOVES_QUIPS[Math.floor(Math.random() * OUT_OF_MOVES_QUIPS.length)];
			outOfMovesQuip.textContent = quip;
			document.querySelector("main").classList.add("out-of-moves-active");
			outOfMovesBackdrop.classList.add("is-visible");
			outOfMovesBackdrop.setAttribute("aria-hidden", "false");
			outOfMovesPopup.classList.add("is-visible");
			outOfMovesPopup.setAttribute("aria-hidden", "false");
			notifyParentHowToPlayOpen(true);
		}

		function closeOutOfMovesPopup() {
			if (!outOfMovesPopup.classList.contains("is-visible"))
				return;
			document.querySelector("main").classList.remove("out-of-moves-active");
			outOfMovesBackdrop.classList.remove("is-visible");
			outOfMovesBackdrop.setAttribute("aria-hidden", "true");
			outOfMovesPopup.classList.remove("is-visible");
			outOfMovesPopup.setAttribute("aria-hidden", "true");
			syncParentOverlayState();
		}

		function isGameOverlayOpen() {
			return howToPlayPopup.classList.contains("is-visible")
				|| settingsPopup.classList.contains("is-visible")
				|| outOfMovesPopup.classList.contains("is-visible");
		}

		function syncParentOverlayState() {
			notifyParentHowToPlayOpen(isGameOverlayOpen());
		}

		function openSettings() {
			if (outOfMovesPopup.classList.contains("is-visible")) return;
			settingsBackdrop.classList.add("is-visible");
			settingsBackdrop.setAttribute("aria-hidden", "false");
			settingsPopup.classList.add("is-visible");
			settingsPopup.setAttribute("aria-hidden", "false");
			notifyParentHowToPlayOpen(true);
		}

		function closeSettings() {
			if (!settingsPopup.classList.contains("is-visible"))
				return;
			settingsBackdrop.classList.remove("is-visible");
			settingsBackdrop.setAttribute("aria-hidden", "true");
			settingsPopup.classList.remove("is-visible");
			settingsPopup.setAttribute("aria-hidden", "true");
			syncParentOverlayState();
		}

		document.querySelector(".how-to-play-button").addEventListener("click", openHowToPlay);
		document.querySelector(".how-to-play-close").addEventListener("click", closeHowToPlay);
		howToPlayBackdrop.addEventListener("click", closeHowToPlay);
		document.querySelector(".settings-button").addEventListener("click", openSettings);
		document.querySelector(".settings-close").addEventListener("click", closeSettings);
		settingsBackdrop.addEventListener("click", closeSettings);
		boxesContainer.addEventListener("click", (event) => {
			if (outOfMovesPopup.classList.contains("is-visible")) return;
			const box = event.target.closest(".box");
			if (!box || !boxesContainer.contains(box)) return;
			const source = selectedTube();
			if (source && source !== box) {
				moveCubes(source, box);
				return;
			}
			selectTopRun(box);
		});

		level = LEVELS[CURRENT_LEVEL];
		applyLevelVisual(level);
		buildTubes(level);

		document.addEventListener("keydown", (event) => {
			if (event.key !== "Escape") return;
			if (outOfMovesPopup.classList.contains("is-visible")) return;
			if (settingsPopup.classList.contains("is-visible")) {
				event.preventDefault();
				closeSettings();
				return;
			}
			if (howToPlayPopup.classList.contains("is-visible")) {
				event.preventDefault();
				closeHowToPlay();
			}
		});

		window.addEventListener("message", (event) => {
			if (event.origin !== window.location.origin) return;
			const data = event.data;
			if (!data || data.source !== "kennethhsu-parent" || data.type !== "close-how-to-play") return;
			closeHowToPlay();
			closeSettings();
		});

		notifyParentHowToPlayOpen(false);

		function realisticConfetti() {
			if (typeof confetti === "undefined") return;
			const count = 200;
			const defaults = {
				origin: { y: 0.7 }
			};

			function fire(particleRatio, opts) {
				confetti({
					...defaults,
					...opts,
					particleCount: Math.floor(count * particleRatio)
				});
			}

			fire(0.25, {
				spread: 26,
				startVelocity: 55
			});
			fire(0.2, {
				spread: 60
			});
			fire(0.35, {
				spread: 100,
				decay: 0.91,
				scalar: 0.8
			});
			fire(0.1, {
				spread: 120,
				startVelocity: 25,
				decay: 0.92,
				scalar: 1.2
			});
			fire(0.1, {
				spread: 120,
				startVelocity: 45
			});
		}

		newGame();
	</script>
</body>
</html>
